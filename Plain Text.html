<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caçador vs Javalis - Mundo Aberto Pixel Art</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background: #081008;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

#game-container {
    position: relative;
    width: 1000px;
    height: 600px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
    border-radius: 4px;
    overflow: hidden;
    border: 4px solid #1a3318;
}

canvas{
    background: #1b381e;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: crosshair;
    display: block;
}

/* Modal de Habilidades */
#skill-modal {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 1000px;
    height: 600px;
    background: rgba(8, 16, 8, 0.92);
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    z-index: 10;
}

#skill-modal h2 {
    font-size: 32px;
    margin-bottom: 5px;
    color: #f1c40f;
    font-family: monospace;
}

#skill-modal p {
    font-size: 15px;
    margin-bottom: 25px;
    color: #cbd5e1;
    font-family: monospace;
}

.skills-cards {
    display: flex;
    gap: 30px;
}

.skill-card {
    position: relative;
    background: #122414;
    border: 3px solid #f1c40f;
    border-radius: 4px;
    width: 280px;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    overflow: hidden;
    transition: transform 0.1s;
}

.skill-card:hover {
    transform: scale(1.02);
}

.skill-card h3 {
    position: relative;
    z-index: 2;
    font-size: 20px;
    margin-bottom: 12px;
    color: #f39c12;
    font-family: monospace;
}

.skill-card p {
    position: relative;
    z-index: 2;
    font-size: 13px;
    color: #a3b8a3;
    line-height: 1.4;
    margin-bottom: 15px;
    font-family: monospace;
}

.hold-instruction {
    position: relative;
    z-index: 2;
    font-size: 11px;
    font-weight: bold;
    color: #f1c40f;
    text-transform: uppercase;
    font-family: monospace;
}

.hold-progress {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0%;
    height: 100%;
    background: rgba(241, 196, 15, 0.3);
    transition: width 0.05s linear;
    z-index: 1;
    pointer-events: none;
}

/* Overlay da Cutscene */
#cutscene-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 1000px;
    height: 600px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding-bottom: 60px;
    z-index: 20;
    pointer-events: auto;
}

#start-button {
    display: none;
    padding: 15px 40px;
    font-size: 22px;
    font-family: monospace;
    font-weight: bold;
    color: #111;
    background: #f1c40f;
    border: 3px solid #ffffff;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(241, 196, 15, 0.6);
    transition: all 0.2s;
}

#start-button:hover {
    background: #f39c12;
    transform: scale(1.08);
}
</style>
</head>

<body>

<div id="game-container">
    <canvas id="game" width="1000" height="600"></canvas>

    <div id="cutscene-overlay">
        <button id="start-button">INICIAR JOGO</button>
    </div>

    <div id="skill-modal">
        <h2>EVOLUÇÃO DISPONÍVEL!</h2>
        <p>Aperte e segure por 1 segundo a habilidade para escolher:</p>
        <div id="skills-container" class="skills-cards">
        </div>
    </div>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

const VIEW_WIDTH = canvas.width;
const VIEW_HEIGHT = canvas.height;

const WORLD_WIDTH = 2400;
const WORLD_HEIGHT = 1800;

// Carregando Imagens
const bowImg = new Image();
bowImg.src = "arco_de_caça2.png";

const arrowCommonImg = new Image();
arrowCommonImg.src = "flecha_comum.png";

const arrowKamikazeImg = new Image();
arrowKamikazeImg.src = "flecha_kamikaze.png";

// Imagens do Caçador
const hunterImgNormal = new Image();
hunterImgNormal.src = "caçador.png";

const hunterImgLeft = new Image();
hunterImgLeft.src = "caçador_esquerda.png";

const hunterImgRight = new Image();
hunterImgRight.src = "caçador_direita.png";

const hunterImgUp = new Image();
hunterImgUp.src = "caçador_cima.png";

const hunterImgDown = new Image();
hunterImgDown.src = "caçador_baixo.png";

const boarImgSmall = new Image();
boarImgSmall.src = "javali_pequeno.png";

const boarImgMedium = new Image();
boarImgMedium.src = "javali_medio.png";

const boarImgLarge = new Image();
boarImgLarge.src = "javali_grande.png";

const boarImgBoss = new Image();
boarImgBoss.src = "javali_boss.png";

// Imagens de Fim de Jogo
const victoryImg = new Image();
victoryImg.src = "vitoria.png";

const defeatImg = new Image();
defeatImg.src = "derrota.png";

// Controle da Cutscene
let inCutscene = true;
let cutsceneTimer = 0;
let cutsceneBoars = [];
let cutsceneDust = [];

function initCutscene() {
    inCutscene = true;
    cutsceneTimer = 0;
    cutsceneBoars = [];
    cutsceneDust = [];
    document.getElementById("start-button").style.display = "none";
    document.getElementById("cutscene-overlay").style.display = "flex";

    for (let i = 0; i < 35; i++) {
        let size = 80 + Math.random() * 90;
        let img = boarImgSmall;
        if (size > 140) img = boarImgLarge;
        else if (size > 110) img = boarImgMedium;

        cutsceneBoars.push({
            x: -200 - Math.random() * 1000,
            y: 120 + Math.random() * 360,
            speed: 7 + Math.random() * 5,
            size: size,
            img: img
        });
    }
}

document.getElementById("start-button").addEventListener("click", () => {
    inCutscene = false;
    document.getElementById("cutscene-overlay").style.display = "none";
    resetGame();
});

let hunter;
let camera = { x: 0, y: 0 };
let arrows;
let boars;
let explosions = [];
let score;
let boarsKilled;
let spawnInterval;
let spawnTimer;
let shieldTimer;
let kamikazeTimer;
let gameOver;
let gameWon = false;

let boss = null;
let bossDashTimer = 0;

// Elementos Pixel Art do Mapa
let trees = [];
let grassPixels = [];
let dirtPaths = [];
let spores = [];

function generatePixelJungle() {
    trees = [];
    grassPixels = [];
    dirtPaths = [];
    spores = [];

    const PIXEL_SIZE = 16;

    const numPaths = 5;
    for (let p = 0; p < numPaths; p++) {
        let curX = Math.floor((Math.random() * (WORLD_WIDTH - 200) + 100) / PIXEL_SIZE) * PIXEL_SIZE;
        let curY = Math.floor((Math.random() * (WORLD_HEIGHT - 200) + 100) / PIXEL_SIZE) * PIXEL_SIZE;
        let pathLength = 35 + Math.floor(Math.random() * 25);
        
        let dirX = (Math.random() - 0.5) * 2;
        let dirY = (Math.random() - 0.5) * 2;

        for (let step = 0; step < pathLength; step++) {
            let widthBlocks = 3 + Math.floor(Math.random() * 3);

            for (let bx = -widthBlocks; bx <= widthBlocks; bx++) {
                for (let by = -widthBlocks; by <= widthBlocks; by++) {
                    if (Math.abs(bx) + Math.abs(by) <= widthBlocks) {
                        let px = curX + bx * PIXEL_SIZE;
                        let py = curY + by * PIXEL_SIZE;

                        if (px >= 0 && px < WORLD_WIDTH && py >= 0 && py < WORLD_HEIGHT) {
                            let randCol = Math.random();
                            let color = '#c2b280';
                            if (randCol > 0.6) color = '#a89868';
                            else if (randCol < 0.2) color = '#8c7b50';

                            dirtPaths.push({
                                x: px,
                                y: py,
                                size: PIXEL_SIZE,
                                color: color
                            });
                        }
                    }
                }
            }

            dirX += (Math.random() - 0.5) * 0.5;
            dirY += (Math.random() - 0.5) * 0.5;

            let mag = Math.sqrt(dirX * dirX + dirY * dirY) || 1;
            curX += Math.round((dirX / mag)) * PIXEL_SIZE;
            curY += Math.round((dirY / mag)) * PIXEL_SIZE;
        }
    }

    for (let i = 0; i < 600; i++) {
        grassPixels.push({
            x: Math.floor((Math.random() * WORLD_WIDTH) / 8) * 8,
            y: Math.floor((Math.random() * WORLD_HEIGHT) / 8) * 8,
            width: (Math.floor(Math.random() * 2) + 1) * 8,
            height: (Math.floor(Math.random() * 2) + 1) * 8,
            color: Math.random() > 0.5 ? '#152e18' : '#234726'
        });
    }

    for (let i = 0; i < 90; i++) {
        trees.push({
            x: Math.floor((Math.random() * (WORLD_WIDTH - 100)) / 16) * 16,
            y: Math.floor((Math.random() * (WORLD_HEIGHT - 100)) / 16) * 16,
            size: (Math.floor(Math.random() * 2) + 4) * 16
        });
    }

    for (let i = 0; i < 80; i++) {
        spores.push({
            x: Math.random() * WORLD_WIDTH,
            y: Math.random() * WORLD_HEIGHT,
            size: 4,
            color: Math.random() > 0.5 ? '#5ce663' : '#a2f5a6',
            speedY: -0.3 - Math.random() * 0.3,
            speedX: (Math.random() - 0.5) * 0.2
        });
    }
}

// Lista de Habilidades
const ALL_SKILLS = [
    { id: 'double', weight: 75, title: 'Flechas Duplas', desc: 'Atira duas flechas paralelas!' },
    { id: 'shield', weight: 75, title: 'Escudo de Flechas', desc: 'Adiciona uma flecha girando ao seu redor a cada 15s (Máx: 6).' },
    { id: 'bounce', weight: 75, title: 'Flecha Ricochete', desc: 'Suas flechas rebatem para atingir outro javali próximo!' },
    { id: 'kamikaze', weight: 15, title: 'Flecha Explosiva', desc: 'A cada 20s dispara uma flecha de alto dano em área!' },
    { id: 'revive', weight: 5, title: 'Espírito Guerreiro', desc: 'Ao morrer, revive 1 vez gerando uma onda de choque!' }
];

let nextSkillScore = 50;
let isChoosingSkill = false;
let skills = {
    double: false,
    shieldUnlocked: false,
    shieldCount: 0,
    bounce: false,
    kamikazeUnlocked: false,
    kamikazeReady: false,
    reviveUnlocked: false,
    reviveUsed: false
};

const mouseScreen = { x: VIEW_WIDTH / 2, y: 0 };
const mouseWorld = { x: WORLD_WIDTH / 2, y: 0 };

function updateSpawnRate(){
    if(boss || inCutscene) return;
    if(spawnTimer) clearInterval(spawnTimer);
    let level = Math.floor(boarsKilled / 20);
    spawnInterval = Math.max(300, 1500 - (level * 150));
    spawnTimer = setInterval(spawnBoar, spawnInterval);
}

function startShieldTimer(){
    if(shieldTimer) clearInterval(shieldTimer);
    shieldTimer = setInterval(() => {
        if(!gameOver && !gameWon && !isChoosingSkill && !inCutscene && skills.shieldUnlocked && skills.shieldCount < 6){
            skills.shieldCount++;
        }
    }, 15000);
}

function startKamikazeTimer(){
    if(kamikazeTimer) clearInterval(kamikazeTimer);
    kamikazeTimer = setInterval(() => {
        if(!gameOver && !gameWon && !isChoosingSkill && !inCutscene && skills.kamikazeUnlocked && !skills.kamikazeReady){
            skills.kamikazeReady = true;
        }
    }, 20000);
}

function performDash() {
    if (hunter.dashCooldownTimer > 0 || hunter.isDashing) return;

    let dirX = 0;
    let dirY = 0;

    if (keys["w"]) dirY -= 1;
    if (keys["s"]) dirY += 1;
    if (keys["a"]) dirX -= 1;
    if (keys["d"]) dirX += 1;

    // Se estiver parado, faz o dash para a direção que está olhando
    if (dirX === 0 && dirY === 0) {
        dirX = Math.cos(hunter.angle);
        dirY = Math.sin(hunter.angle);
    } else {
        let mag = Math.sqrt(dirX * dirX + dirY * dirY);
        dirX /= mag;
        dirY /= mag;
    }

    hunter.isDashing = true;
    hunter.dashDirX = dirX;
    hunter.dashDirY = dirY;
    hunter.dashTimer = 8; // Duração do dash em frames
    hunter.dashCooldownTimer = 15; // Cooldown de 15 segundos
}

function resetGame(){
    if(kamikazeTimer) clearInterval(kamikazeTimer);
    if(spawnTimer) clearInterval(spawnTimer);

    hunter = {
        x: WORLD_WIDTH / 2,
        y: WORLD_HEIGHT / 2,
        speed: 3.5,
        angle: -Math.PI / 2,
        cooldown: 0,
        shieldAngle: 0,
        facing: 'normal',
        isDashing: false,
        dashTimer: 0,
        dashCooldownTimer: 0,
        dashDirX: 0,
        dashDirY: 0
    };
    arrows = [];
    boars = [];
    explosions = [];
    score = 0;
    boarsKilled = 0;
    nextSkillScore = 50;
    gameOver = false;
    gameWon = false;
    isChoosingSkill = false;
    boss = null;
    bossDashTimer = 0;
    
    skills = {
        double: false,
        shieldUnlocked: false,
        shieldCount: 0,
        bounce: false,
        kamikazeUnlocked: false,
        kamikazeReady: false,
        reviveUnlocked: false,
        reviveUsed: false
    };

    generatePixelJungle();

    document.getElementById("skill-modal").style.display = "none";
    
    if(!inCutscene){
        updateSpawnRate();
        startShieldTimer();
    }
}

initCutscene();

const keys = {};

document.addEventListener("keydown", (e) => {
    keys[e.key.toLowerCase()] = true;
    if(e.key.toLowerCase() === 'r' && !inCutscene){
        resetGame();
    }
    if(e.key === 'Shift' && !inCutscene && !gameOver && !gameWon && !isChoosingSkill){
        performDash();
    }
});

document.addEventListener("keyup", (e) => {
    keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseScreen.x = e.clientX - rect.left;
    mouseScreen.y = e.clientY - rect.top;
});

let isMouseDown = false;
canvas.addEventListener("mousedown", (e) => {
    if(e.button === 0) isMouseDown = true;
});
canvas.addEventListener("mouseup", (e) => {
    if(e.button === 0) isMouseDown = false;
});

function getRandomSkills(count) {
    let available = ALL_SKILLS.filter(s => {
        if(s.id === 'double' && skills.double) return false;
        if(s.id === 'shield' && skills.shieldUnlocked) return false;
        if(s.id === 'bounce' && skills.bounce) return false;
        if(s.id === 'kamikaze' && skills.kamikazeUnlocked) return false;
        if(s.id === 'revive' && skills.reviveUnlocked) return false;
        return true;
    });

    let selected = [];
    let pool = [...available];

    for(let i = 0; i < count && pool.length > 0; i++) {
        let totalWeight = pool.reduce((sum, s) => sum + s.weight, 0);
        let random = Math.random() * totalWeight;
        let cumulative = 0;

        for(let j = 0; j < pool.length; j++) {
            cumulative += pool[j].weight;
            if(random <= cumulative) {
                selected.push(pool[j]);
                pool.splice(j, 1);
                break;
            }
        }
    }
    return selected;
}

function triggerSkillSelection(){
    let choices = getRandomSkills(2);

    if(choices.length === 0){
        nextSkillScore += 50;
        return;
    }

    const container = document.getElementById("skills-container");
    container.innerHTML = "";

    choices.forEach(skill => {
        const card = document.createElement("div");
        card.className = "skill-card";
        
        card.innerHTML = `
            <div class="hold-progress"></div>
            <h3>${skill.title}</h3>
            <p>${skill.desc}</p>
            <div class="hold-instruction">Segure para escolher</div>
        `;

        let holdTimer = null;
        let holdInterval = null;
        let holdProgress = 0;
        const HOLD_DURATION = 1000;
        const progressBar = card.querySelector(".hold-progress");

        function startHold(e) {
            e.preventDefault();
            holdProgress = 0;
            progressBar.style.width = "0%";

            let startTime = Date.now();

            holdInterval = setInterval(() => {
                let elapsedTime = Date.now() - startTime;
                holdProgress = Math.min(100, (elapsedTime / HOLD_DURATION) * 100);
                progressBar.style.width = holdProgress + "%";
            }, 20);

            holdTimer = setTimeout(() => {
                cancelHold();
                selectSkill(skill.id);
            }, HOLD_DURATION);
        }

        function cancelHold() {
            if(holdTimer) clearTimeout(holdTimer);
            if(holdInterval) clearInterval(holdInterval);
            holdTimer = null;
            holdInterval = null;
            holdProgress = 0;
            if(progressBar) progressBar.style.width = "0%";
        }

        card.addEventListener("mousedown", startHold);
        card.addEventListener("mouseup", cancelHold);
        card.addEventListener("mouseleave", cancelHold);
        card.addEventListener("touchstart", startHold);
        card.addEventListener("touchend", cancelHold);

        container.appendChild(card);
    });

    isChoosingSkill = true;
    document.getElementById("skill-modal").style.display = "flex";
}

function selectSkill(skillName){
    if(skillName === 'double') skills.double = true;
    if(skillName === 'shield') {
        skills.shieldUnlocked = true;
        if(skills.shieldCount < 6) skills.shieldCount++;
    }
    if(skillName === 'bounce') skills.bounce = true;
    if(skillName === 'kamikaze') {
        skills.kamikazeUnlocked = true;
        skills.kamikazeReady = true;
        startKamikazeTimer();
    }
    if(skillName === 'revive') {
        skills.reviveUnlocked = true;
    }

    nextSkillScore += 50;
    isChoosingSkill = false;
    document.getElementById("skill-modal").style.display = "none";
}

function handlePlayerDeath(){
    if(skills.reviveUnlocked && !skills.reviveUsed){
        skills.reviveUsed = true;
        
        const pushRadius = 350;
        explosions.push({ x: hunter.x, y: hunter.y, radius: 10, maxRadius: pushRadius, alpha: 1 });

        for(let b of boars){
            let bdx = b.x - hunter.x;
            let bdy = b.y - hunter.y;
            let dist = Math.sqrt(bdx*bdx + bdy*bdy);

            if(dist < pushRadius){
                let pushDist = 300;
                let angle = Math.atan2(bdy, bdx);
                if(dist === 0) angle = Math.random() * Math.PI * 2;

                b.x += Math.cos(angle) * pushDist;
                b.y += Math.sin(angle) * pushDist;

                b.x = Math.max(30, Math.min(WORLD_WIDTH - 30, b.x));
                b.y = Math.max(30, Math.min(WORLD_HEIGHT - 30, b.y));
            }
        }
    } else {
        gameOver = true;
    }
}

function spawnBoss(){
    if(spawnTimer) clearInterval(spawnTimer);
    boars = [];

    boss = {
        x: WORLD_WIDTH / 2,
        y: WORLD_HEIGHT / 2 - 200,
        size: 380,
        hp: 250,
        maxHp: 250,
        speed: 1.2,
        img: boarImgBoss,
        state: "normal",
        targetAngle: 0,
        aimTimer: 0,
        dashTimer: 0
    };

    bossDashTimer = 0;
}

function checkBoarKills(){
    if(boarsKilled >= 200 && !boss){
        spawnBoss();
    }
}

function spawnBoar(){
    if(gameOver || gameWon || isChoosingSkill || boss || inCutscene) return;

    const side = Math.floor(Math.random() * 4);
    let bx, by;

    if(side === 0) { bx = Math.random() * WORLD_WIDTH; by = -60; }
    else if(side === 1) { bx = Math.random() * WORLD_WIDTH; by = WORLD_HEIGHT + 60; }
    else if(side === 2) { bx = -60; by = Math.random() * WORLD_HEIGHT; }
    else { bx = WORLD_WIDTH + 60; by = Math.random() * WORLD_HEIGHT; }

    const rand = Math.random();
    let typeConfig;

    if(rand < 0.5) {
        typeConfig = { size: 90, hp: 1, maxHp: 1, speed: 2.0 + Math.random()*0.5, points: 1, img: boarImgSmall };
    } else if(rand < 0.85) {
        typeConfig = { size: 130, hp: 2, maxHp: 2, speed: 1.4 + Math.random()*0.4, points: 2, img: boarImgMedium };
    } else {
        typeConfig = { size: 170, hp: 3, maxHp: 3, speed: 0.6 + Math.random()*0.3, points: 4, img: boarImgLarge };
    }

    boars.push({
        id: Math.random(),
        x: bx,
        y: by,
        size: typeConfig.size,
        hp: typeConfig.hp,
        maxHp: typeConfig.maxHp,
        speed: typeConfig.speed,
        points: typeConfig.points,
        img: typeConfig.img
    });
}

function createArrow(angle, offsetX = 0, offsetY = 0, isKamikaze = false){
    const speed = 10;
    return {
        x: hunter.x + offsetX,
        y: hunter.y + offsetY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        angle: angle,
        bounced: false,
        isKamikaze: isKamikaze
    };
}

function shoot(){
    let isKamikaze = false;

    if(skills.kamikazeReady){
        isKamikaze = true;
        skills.kamikazeReady = false;
    }

    if(skills.double){
        const perpX = -Math.sin(hunter.angle) * 16;
        const perpY = Math.cos(hunter.angle) * 16;

        arrows.push(createArrow(hunter.angle, perpX, perpY, isKamikaze));
        arrows.push(createArrow(hunter.angle, -perpX, -perpY, isKamikaze));
    } else {
        arrows.push(createArrow(hunter.angle, 0, 0, isKamikaze));
    }
}

function triggerExplosion(x, y){
    const explosionRadius = 160;

    explosions.push({ x: x, y: y, radius: 10, maxRadius: explosionRadius, alpha: 1 });

    if(boss){
        let dx = boss.x - x;
        let dy = boss.y - y;
        if(Math.sqrt(dx*dx + dy*dy) <= explosionRadius + boss.size/2){
            boss.hp -= 15;
            if(boss.hp <= 0){
                gameWon = true;
            }
        }
    }

    for(let i = boars.length - 1; i >= 0; i--){
        let b = boars[i];
        let dx = b.x - x;
        let dy = b.y - y;
        if(Math.sqrt(dx*dx + dy*dy) <= explosionRadius + b.size/2){
            score += b.points;
            boarsKilled++;
            checkBoarKills();
            if(boarsKilled % 20 === 0) updateSpawnRate();
            boars.splice(i, 1);
        }
    }
}

function updateCutscene() {
    cutsceneTimer++;

    for (let b of cutsceneBoars) {
        b.x += b.speed;
        
        if (Math.random() < 0.4) {
            cutsceneDust.push({
                x: b.x - b.size / 4,
                y: b.y + b.size / 3 + (Math.random() - 0.5) * 10,
                size: 4 + Math.random() * 8,
                alpha: 0.8
            });
        }
    }

    for (let i = cutsceneDust.length - 1; i >= 0; i--) {
        let d = cutsceneDust[i];
        d.x -= 1;
        d.alpha -= 0.03;
        if (d.alpha <= 0) cutsceneDust.splice(i, 1);
    }

    if (cutsceneTimer > 360) {
        document.getElementById("start-button").style.display = "block";
    }
}

function drawPixelTree(ctx, x, y, size) {
    const s = size / 4;
    
    ctx.fillStyle = "#122114";
    ctx.fillRect(x - s, y + size - s, size + s*2, s*1.5);

    ctx.fillStyle = "#4a2810";
    ctx.fillRect(x + s*1.5, y + s*2, s, s*2);

    ctx.fillStyle = "#0f3814";
    ctx.fillRect(x, y + s, size, s*2);
    ctx.fillRect(x + s*0.5, y, size - s, size);

    ctx.fillStyle = "#1a5420";
    ctx.fillRect(x + s*0.5, y + s*0.5, size - s, s*1.5);

    ctx.fillStyle = "#277a2f";
    ctx.fillRect(x + s, y + s*0.5, s*1.5, s);
}

function drawCutscene() {
    let shakeX = 0;
    let shakeY = 0;

    if (cutsceneTimer < 240) {
        shakeX = (Math.random() - 0.5) * 4;
        shakeY = (Math.random() - 0.5) * 4;
    }

    ctx.save();
    ctx.translate(shakeX, shakeY);

    if (cutsceneTimer < 250) {
        ctx.fillStyle = "#1b381e";
        ctx.fillRect(-20, -20, VIEW_WIDTH + 40, VIEW_HEIGHT + 40);

        for(let i = 0; i < 15; i++) {
            drawPixelTree(ctx, (i * 80) % VIEW_WIDTH, (i * 45) % (VIEW_HEIGHT - 100), 80);
        }

        for (let d of cutsceneDust) {
            ctx.fillStyle = `rgba(168, 152, 104, ${d.alpha})`;
            ctx.fillRect(d.x, d.y, d.size, d.size);
        }

        for (let b of cutsceneBoars) {
            if (b.img.complete && b.img.naturalWidth !== 0) {
                ctx.drawImage(b.img, Math.floor(b.x), Math.floor(b.y), b.size, b.size);
            } else {
                ctx.fillStyle = "#6a3c20";
                ctx.fillRect(b.x, b.y, b.size, b.size);
            }
        }
        
        for(let i = 0; i < 5; i++) {
            drawPixelTree(ctx, (i * 220 + 50) % VIEW_WIDTH, VIEW_HEIGHT - 140 + (i*10), 140);
        }
    }

    ctx.restore();

    if (cutsceneTimer >= 220 && cutsceneTimer <= 270) {
        let fadeAlpha = (cutsceneTimer - 220) / 30;
        if (cutsceneTimer > 250) fadeAlpha = (270 - cutsceneTimer) / 20;
        ctx.fillStyle = `rgba(0, 0, 0, ${Math.min(1, Math.max(0, fadeAlpha))})`;
        ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);
    }

    if (cutsceneTimer >= 250) {
        ctx.fillStyle = "#3e2723";
        ctx.fillRect(0, 0, VIEW_WIDTH, 400);
        
        ctx.fillStyle = "#4e342e";
        ctx.fillRect(0, 400, VIEW_WIDTH, 200);
        
        ctx.strokeStyle = "#35221e";
        ctx.lineWidth = 3;
        for(let i = 0; i < VIEW_WIDTH; i += 50) {
            ctx.beginPath();
            ctx.moveTo(i, 400);
            ctx.lineTo(i - 80, 600);
            ctx.stroke();
        }

        ctx.fillStyle = "#0a140c"; 
        ctx.fillRect(VIEW_WIDTH / 2 - 120, 80, 240, 160);
        ctx.strokeStyle = "#1a0f0a";
        ctx.lineWidth = 12;
        ctx.strokeRect(VIEW_WIDTH / 2 - 120, 80, 240, 160);
        
        ctx.fillStyle = "#1a0f0a";
        ctx.fillRect(VIEW_WIDTH / 2 - 6, 80, 12, 160); 
        ctx.fillRect(VIEW_WIDTH / 2 - 120, 154, 240, 12); 

        const hunterWidth = 140; 
        const hunterHeight = 140;
        const hX = VIEW_WIDTH / 2 - hunterWidth / 2;
        const hY = 280; 

        if (hunterImgNormal.complete && hunterImgNormal.naturalWidth !== 0) {
            ctx.drawImage(hunterImgNormal, hX, hY, hunterWidth, hunterHeight);
        } else {
            ctx.fillStyle = "#3559d8";
            ctx.fillRect(hX, hY, hunterWidth, hunterHeight);
        }

        let grad = ctx.createRadialGradient(VIEW_WIDTH / 2, hY + 70, 20, VIEW_WIDTH / 2, hY + 70, 400);
        grad.addColorStop(0, "rgba(255, 230, 150, 0.15)");
        grad.addColorStop(1, "rgba(0, 0, 0, 0.85)");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);

        if (cutsceneTimer >= 290) {
            let textAlpha = Math.min(1, (cutsceneTimer - 290) / 40);
            ctx.save();
            ctx.globalAlpha = textAlpha;
            ctx.fillStyle = "#f1c40f";
            ctx.font = "bold 38px monospace";
            ctx.textAlign = "center";
            ctx.shadowColor = "#000000";
            ctx.shadowBlur = 12;
            ctx.fillText("O MUNDO PRECISA DE UM HERÓI", VIEW_WIDTH / 2, 160);
            ctx.restore();
        }
    }
}

function update(){

    if(inCutscene){
        updateCutscene();
        return;
    }

    if(gameOver || gameWon || isChoosingSkill) return;

    if(score >= nextSkillScore){
        triggerSkillSelection();
        return;
    }

    // Atualização do Cooldown do Dash
    if (hunter.dashCooldownTimer > 0) {
        hunter.dashCooldownTimer -= 1 / 60;
        if (hunter.dashCooldownTimer < 0) hunter.dashCooldownTimer = 0;
    }

    // Lógica do Dash Ativo
    if (hunter.isDashing) {
        const dashSpeedMultiplier = 4;
        hunter.x += hunter.dashDirX * hunter.speed * dashSpeedMultiplier;
        hunter.y += hunter.dashDirY * hunter.speed * dashSpeedMultiplier;

        hunter.dashTimer--;
        if (hunter.dashTimer <= 0) {
            hunter.isDashing = false;
        }
    } else {
        let moveX = 0;
        let moveY = 0;

        if (keys["w"]) moveY -= 1;
        if (keys["s"]) moveY += 1;
        if (keys["a"]) moveX -= 1;
        if (keys["d"]) moveX += 1;

        if (moveX !== 0 && moveY !== 0) {
            moveX *= 0.7071;
            moveY *= 0.7071;
        }

        // Atualização da direção do sprite (Cima/Baixo/Esquerda/Direita)
        if(keys["w"] && !keys["s"]){
            hunter.facing = 'up';
        } else if(keys["s"] && !keys["w"]){
            hunter.facing = 'down';
        } else if(keys["a"] && !keys["d"]){
            hunter.facing = 'left';
        } else if(keys["d"] && !keys["a"]){
            hunter.facing = 'right';
        } else {
            hunter.facing = 'normal';
        }

        hunter.x += moveX * hunter.speed;
        hunter.y += moveY * hunter.speed;
    }

    hunter.x = Math.max(40, Math.min(WORLD_WIDTH - 40, hunter.x));
    hunter.y = Math.max(40, Math.min(WORLD_HEIGHT - 40, hunter.y));

    camera.x = hunter.x - VIEW_WIDTH / 2;
    camera.y = hunter.y - VIEW_HEIGHT / 2;

    camera.x = Math.max(0, Math.min(WORLD_WIDTH - VIEW_WIDTH, camera.x));
    camera.y = Math.max(0, Math.min(WORLD_HEIGHT - VIEW_HEIGHT, camera.y));

    mouseWorld.x = mouseScreen.x + camera.x;
    mouseWorld.y = mouseScreen.y + camera.y;

    const dx = mouseWorld.x - hunter.x;
    const dy = mouseWorld.y - hunter.y;
    hunter.angle = Math.atan2(dy, dx);

    hunter.shieldAngle += 0.03;

    if(hunter.cooldown > 0)
        hunter.cooldown--;

    if((keys["k"] || isMouseDown) && hunter.cooldown <= 0){
        shoot();
        hunter.cooldown = 12;
    }

    for(let p of spores) {
        p.y += p.speedY;
        p.x += p.speedX;
        if(p.y < 0) p.y = WORLD_HEIGHT;
        if(p.x < 0) p.x = WORLD_WIDTH;
        if(p.x > WORLD_WIDTH) p.x = 0;
    }

    for(let i = arrows.length - 1; i >= 0; i--){
        arrows[i].x += arrows[i].vx;
        arrows[i].y += arrows[i].vy;

        if(arrows[i].y < -50 || arrows[i].y > WORLD_HEIGHT + 50 || 
           arrows[i].x < -50 || arrows[i].x > WORLD_WIDTH + 50){
            arrows.splice(i, 1);
        }
    }

    for(let i = explosions.length - 1; i >= 0; i--){
        let exp = explosions[i];
        exp.radius += 8;
        exp.alpha -= 0.04;
        if(exp.alpha <= 0){
            explosions.splice(i, 1);
        }
    }

    if(boss){
        bossDashTimer += 1/60;

        if(boss.state === "normal"){
            let bdx = hunter.x - boss.x;
            let bdy = hunter.y - boss.y;
            let dist = Math.sqrt(bdx*bdx + bdy*bdy);

            if(dist > 0){
                boss.x += (bdx / dist) * boss.speed;
                boss.y += (bdy / dist) * boss.speed;
            }

            if(bossDashTimer >= 25){
                boss.state = "aiming";
                boss.aimTimer = 0;
                boss.targetAngle = Math.atan2(hunter.y - boss.y, hunter.x - boss.x);
            }
        } else if(boss.state === "aiming"){
            boss.aimTimer += 1/60;
            boss.targetAngle = Math.atan2(hunter.y - boss.y, hunter.x - boss.x);

            if(boss.aimTimer >= 1.5){
                boss.state = "dashing";
                boss.dashTimer = 0;
            }
        } else if(boss.state === "dashing"){
            boss.dashTimer += 1/60;
            
            const dashSpeed = 8; 
            boss.x += Math.cos(boss.targetAngle) * dashSpeed;
            boss.y += Math.sin(boss.targetAngle) * dashSpeed;

            boss.x = Math.max(boss.size/2, Math.min(WORLD_WIDTH - boss.size/2, boss.x));
            boss.y = Math.max(boss.size/2, Math.min(WORLD_HEIGHT - boss.size/2, boss.y));

            if(boss.dashTimer >= 1.2){
                boss.state = "normal";
                bossDashTimer = 0;
            }
        }

        let bdx = hunter.x - boss.x;
        let bdy = hunter.y - boss.y;
        let dist = Math.sqrt(bdx*bdx + bdy*bdy);
        if(dist < (boss.size / 2 + 30)){
            handlePlayerDeath();
        }
    }

    for(let boar of boars){
        let bdx = hunter.x - boar.x;
        let bdy = hunter.y - boar.y;
        let dist = Math.sqrt(bdx*bdx + bdy*bdy);

        if(dist > 0){
            boar.x += (bdx / dist) * boar.speed;
            boar.y += (bdy / dist) * boar.speed;
        }

        if(dist < (boar.size / 2 + 30)){
            handlePlayerDeath();
            break;
        }
    }

    if(skills.shieldCount > 0){
        const radius = 110;
        for(let s = skills.shieldCount - 1; s >= 0; s--){
            let currentAngle = hunter.shieldAngle + (s * (Math.PI * 2 / skills.shieldCount));
            let sx = hunter.x + Math.cos(currentAngle) * radius;
            let sy = hunter.y + Math.sin(currentAngle) * radius;

            if(boss){
                let bdx = boss.x - sx;
                let bdy = boss.y - sy;
                if(Math.sqrt(bdx*bdx + bdy*bdy) < (boss.size / 2 + 16)){
                    boss.hp -= 1;
                    skills.shieldCount--;
                    if(boss.hp <= 0) gameWon = true;
                    break;
                }
            }

            for(let i = boars.length - 1; i >= 0; i--){
                let bdx = boars[i].x - sx;
                let bdy = boars[i].y - sy;
                if(Math.sqrt(bdx*bdx + bdy*bdy) < (boars[i].size / 2 + 16)){
                    boars[i].hp--;
                    skills.shieldCount--; 

                    if(boars[i].hp <= 0){
                        score += boars[i].points;
                        boarsKilled++;
                        checkBoarKills();
                        if(boarsKilled % 20 === 0) updateSpawnRate();
                        boars.splice(i, 1);
                    }
                    break;
                }
            }
        }
    }

    for(let j = arrows.length - 1; j >= 0; j--){
        let arrow = arrows[j];

        if(boss){
            let bdx = boss.x - arrow.x;
            let bdy = boss.y - arrow.y;
            if(Math.sqrt(bdx*bdx + bdy*bdy) < (boss.size / 2 + 12)){
                if(arrow.isKamikaze){
                    triggerExplosion(arrow.x, arrow.y);
                } else {
                    boss.hp -= 1;
                    if(boss.hp <= 0) gameWon = true;
                }
                arrows.splice(j, 1);
                continue;
            }
        }

        for(let i = boars.length - 1; i >= 0; i--){
            let boar = boars[i];
            let cdx = boar.x - arrow.x;
            let cdy = boar.y - arrow.y;

            if(Math.sqrt(cdx*cdx + cdy*cdy) < (boar.size / 2 + 12)){
                
                if(arrow.isKamikaze){
                    triggerExplosion(arrow.x, arrow.y);
                    arrows.splice(j, 1);
                    break;
                }

                let hitBoarId = boar.id;
                boar.hp--;
                
                if(boar.hp <= 0){
                    score += boar.points;
                    boarsKilled++;
                    checkBoarKills();
                    if(boarsKilled % 20 === 0) updateSpawnRate();
                    boars.splice(i, 1);
                }

                if(skills.bounce && !arrow.bounced){
                    arrow.bounced = true;

                    let targetBoar = null;
                    let minD = Infinity;

                    for(let b of boars){
                        if(b.id === hitBoarId) continue;

                        let rdx = b.x - arrow.x;
                        let rdy = b.y - arrow.y;
                        let d = Math.sqrt(rdx*rdx + rdy*rdy);
                        if(d < minD){
                            minD = d;
                            targetBoar = b;
                        }
                    }

                    if(targetBoar){
                        let rAngle = Math.atan2(targetBoar.y - arrow.y, targetBoar.x - arrow.x);
                        arrow.vx = Math.cos(rAngle) * 10;
                        arrow.vy = Math.sin(rAngle) * 10;
                        arrow.angle = rAngle;
                    } else {
                        arrows.splice(j, 1);
                    }
                } else {
                    arrows.splice(j, 1);
                }
                break;
            }
        }
    }
}

function draw(){

    if(inCutscene){
        drawCutscene();
        return;
    }

    ctx.fillStyle = "#1b381e";
    ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);

    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    for(let d of dirtPaths) {
        ctx.fillStyle = d.color;
        ctx.fillRect(d.x, d.y, d.size, d.size);
    }

    for(let g of grassPixels) {
        ctx.fillStyle = g.color;
        ctx.fillRect(g.x, g.y, g.width, g.height);
    }

    ctx.fillStyle = "#0c170d";
    ctx.fillRect(-20, -20, WORLD_WIDTH + 40, 20);
    ctx.fillRect(-20, WORLD_HEIGHT, WORLD_WIDTH + 40, 20);
    ctx.fillRect(-20, -20, 20, WORLD_HEIGHT + 40);
    ctx.fillRect(WORLD_WIDTH, -20, 20, WORLD_HEIGHT + 40);

    for(let t of trees) {
        drawPixelTree(ctx, t.x, t.y, t.size);
    }

    if(boss && boss.state === "aiming"){
        ctx.save();
        ctx.strokeStyle = "#e74c3c";
        ctx.lineWidth = 4;
        ctx.setLineDash([12, 12]);
        ctx.beginPath();
        ctx.moveTo(boss.x, boss.y);
        ctx.lineTo(boss.x + Math.cos(boss.targetAngle) * 1500, boss.y + Math.sin(boss.targetAngle) * 1500);
        ctx.stroke();
        ctx.restore();
    }

    for(let exp of explosions){
        ctx.save();
        ctx.beginPath();
        ctx.arc(exp.x, exp.y, exp.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(231, 76, 60, ${exp.alpha})`;
        ctx.fill();
        ctx.strokeStyle = `rgba(241, 196, 15, ${exp.alpha})`;
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.restore();
    }

    for(let a of arrows){
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.angle);

        const currentArrowImg = a.isKamikaze ? arrowKamikazeImg : arrowCommonImg;
        const arrowWidth = a.isKamikaze ? 36 : 28;
        const arrowHeight = a.isKamikaze ? 16 : 12;

        if (currentArrowImg.complete && currentArrowImg.naturalWidth !== 0) {
            ctx.drawImage(currentArrowImg, -arrowWidth / 2, -arrowHeight / 2, arrowWidth, arrowHeight);
        } else {
            if(a.isKamikaze){
                ctx.fillStyle = "#e74c3c";
                ctx.fillRect(-14, -4, 28, 8);
            } else {
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(-11, -3, 22, 6);
                ctx.fillStyle = "#000000";
                ctx.fillRect(5, -3, 6, 6);
            }
        }

        ctx.restore();
    }

    for(let b of boars){
        let halfSize = b.size / 2;

        if (b.img.complete && b.img.naturalWidth !== 0) {
            ctx.drawImage(b.img, Math.floor(b.x - halfSize), Math.floor(b.y - halfSize), b.size, b.size);
        } else {
            ctx.fillStyle = "#6a3c20";
            ctx.fillRect(b.x - halfSize, b.y - halfSize, b.size, b.size);
        }

        if(b.maxHp > 1){
            let barWidth = b.size;
            let barHeight = 8;
            let barX = b.x - halfSize;
            let barY = b.y - halfSize - 12;

            ctx.fillStyle = "#c0392b";
            ctx.fillRect(barX, barY, barWidth, barHeight);

            ctx.fillStyle = "#2ecc71";
            ctx.fillRect(barX, barY, (b.hp / b.maxHp) * barWidth, barHeight);
        }
    }

    if(boss){
        let halfSize = boss.size / 2;

        if (boss.img.complete && boss.img.naturalWidth !== 0) {
            ctx.drawImage(boss.img, Math.floor(boss.x - halfSize), Math.floor(boss.y - halfSize), boss.size, boss.size);
        } else {
            ctx.fillStyle = "#2c1408";
            ctx.fillRect(boss.x - halfSize, boss.y - halfSize, boss.size, boss.size);
        }
    }

    // Seleção da imagem do Caçador com base em hunter.facing
    let currentHunterImg = hunterImgNormal;
    if(hunter.facing === 'up') currentHunterImg = hunterImgUp;
    else if(hunter.facing === 'down') currentHunterImg = hunterImgDown;
    else if(hunter.facing === 'left') currentHunterImg = hunterImgLeft;
    else if(hunter.facing === 'right') currentHunterImg = hunterImgRight;

    const hunterWidth = 140;
    const hunterHeight = 140;

    if (currentHunterImg.complete && currentHunterImg.naturalWidth !== 0) {
        ctx.drawImage(currentHunterImg, Math.floor(hunter.x - hunterWidth / 2), Math.floor(hunter.y - hunterHeight / 2), hunterWidth, hunterHeight);
    } else {
        ctx.fillStyle = "#3559d8";
        ctx.fillRect(hunter.x - 35, hunter.y - 52, 70, 105);
    }

    if(skills.shieldCount > 0){
        const radius = 110;
        for(let s = 0; s < skills.shieldCount; s++){
            let currentAngle = hunter.shieldAngle + (s * (Math.PI * 2 / skills.shieldCount));
            let sx = hunter.x + Math.cos(currentAngle) * radius;
            let sy = hunter.y + Math.sin(currentAngle) * radius;

            ctx.save();
            ctx.translate(sx, sy);
            ctx.rotate(currentAngle + Math.PI / 2);

            if (arrowCommonImg.complete && arrowCommonImg.naturalWidth !== 0) {
                ctx.drawImage(arrowCommonImg, -14, -6, 28, 12);
            } else {
                ctx.fillStyle = "#f39c12";
                ctx.fillRect(-16, -4, 32, 8);
            }

            ctx.restore();
        }
    }

    ctx.save();
    ctx.translate(Math.floor(hunter.x), Math.floor(hunter.y));
    ctx.rotate(hunter.angle);

    const bowWidth = 80;
    const bowHeight = 80;
    if (bowImg.complete && bowImg.naturalWidth !== 0) {
        ctx.drawImage(bowImg, -bowWidth / 2, -bowHeight / 2, bowWidth, bowHeight);
    }

    ctx.restore();

    for(let p of spores) {
        ctx.fillStyle = p.color;
        ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
    }

    ctx.restore();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 18px monospace";
    ctx.fillText("Pontuação: " + score, 20, 35);
    ctx.fillText("Próxima Evolução: " + nextSkillScore + " pts", 20, 60);
    ctx.fillText("Javalis Derrotados: " + boarsKilled + "/200", 20, 85);

    // Status do Dash
    ctx.fillStyle = hunter.dashCooldownTimer === 0 ? "#38bdf8" : "#888888";
    ctx.fillText(hunter.dashCooldownTimer === 0 ? "⚡ DASH PRONTO! [SHIFT]" : `⏳ Dash Recarregando: ${Math.ceil(hunter.dashCooldownTimer)}s`, 20, 115);

    let hudOffsetY = 140;

    if(skills.kamikazeUnlocked){
        ctx.fillStyle = skills.kamikazeReady ? "#f39c12" : "#888888";
        ctx.fillText(skills.kamikazeReady ? "💥 FLECHA EXPLOSIVA PRONTA!" : "⏳ Recarregando Explosiva...", 20, hudOffsetY);
        hudOffsetY += 25;
    }

    if(skills.reviveUnlocked){
        ctx.fillStyle = skills.reviveUsed ? "#888888" : "#2ecc71";
        ctx.fillText(skills.reviveUsed ? "💀 Vida Extra: Usada" : "🔥 Vida Extra: Ativa", 20, hudOffsetY);
    }

    if(boss){
        ctx.save();
        ctx.fillStyle = "#081008";
        ctx.fillRect(VIEW_WIDTH / 2 - 250, 15, 500, 30);

        ctx.fillStyle = "#c0392b";
        ctx.fillRect(VIEW_WIDTH / 2 - 245, 20, (boss.hp / boss.maxHp) * 490, 20);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 14px monospace";
        ctx.textAlign = "center";
        ctx.fillText(`BOSS JAVALI SUPREMO: ${Math.max(0, boss.hp)} / ${boss.maxHp}`, VIEW_WIDTH / 2, 35);
        ctx.restore();
    }

    ctx.fillStyle = "#aaaaaa";
    ctx.font = "12px monospace";
    ctx.fillText("WASD: Mover | SHIFT: Dash | MOUSE: Mirar | CLIQUE/K: Atirar", 20, 580);

    const mapSize = 120;
    const mapX = VIEW_WIDTH - mapSize - 20;
    const mapY = 20;
    const scaleX = mapSize / WORLD_WIDTH;
    const scaleY = mapSize / WORLD_HEIGHT;

    ctx.fillStyle = "#081008";
    ctx.fillRect(mapX, mapY, mapSize, mapSize);
    ctx.strokeStyle = "#333333";
    ctx.strokeRect(mapX, mapY, mapSize, mapSize);

    ctx.fillStyle = "#8c7b50";
    for(let d of dirtPaths) {
        if(Math.random() < 0.05){
            ctx.fillRect(mapX + d.x * scaleX, mapY + d.y * scaleY, 2, 2);
        }
    }

    ctx.fillStyle = "#38bdf8";
    ctx.fillRect(mapX + hunter.x * scaleX - 2, mapY + hunter.y * scaleY - 2, 4, 4);

    if(boss){
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(mapX + boss.x * scaleX - 3, mapY + boss.y * scaleY - 3, 6, 6);
    } else {
        ctx.fillStyle = "#f87171";
        for(let b of boars){
            ctx.fillRect(mapX + b.x * scaleX - 1, mapY + b.y * scaleY - 1, 2, 2);
        }
    }

    if(gameOver){
        if (defeatImg.complete && defeatImg.naturalWidth !== 0) {
            ctx.drawImage(defeatImg, 0, 0, VIEW_WIDTH, VIEW_HEIGHT);
        } else {
            ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
            ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);
            ctx.fillStyle = "#ef4444";
            ctx.font = "bold 48px monospace";
            ctx.textAlign = "center";
            ctx.fillText("OS JAVALIS GANHARAM", VIEW_WIDTH / 2, 280);
        }
        
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 20px monospace";
        ctx.textAlign = "center";
        ctx.shadowColor = "black";
        ctx.shadowBlur = 6;
        ctx.fillText("Pressione 'R' para Reiniciar", VIEW_WIDTH / 2, VIEW_HEIGHT - 40);
        ctx.shadowBlur = 0;
    }

    if(gameWon){
        if (victoryImg.complete && victoryImg.naturalWidth !== 0) {
            ctx.drawImage(victoryImg, 0, 0, VIEW_WIDTH, VIEW_HEIGHT);
        } else {
            ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
            ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);
            ctx.fillStyle = "#22c55e";
            ctx.font = "bold 48px monospace";
            ctx.textAlign = "center";
            ctx.fillText("O CAÇADOR GANHOU", VIEW_WIDTH / 2, 280);
        }
        
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 20px monospace";
        ctx.textAlign = "center";
        ctx.shadowColor = "black";
        ctx.shadowBlur = 6;
        ctx.fillText("Pressione 'R' para Jogar Novamente", VIEW_WIDTH / 2, VIEW_HEIGHT - 40);
        ctx.shadowBlur = 0;
    }
}

function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();

</script>

</html>
